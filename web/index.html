<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pose CSV → Test Analizi</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         max-width: 760px; margin: 0 auto; padding: 24px 16px 64px;
         line-height: 1.45; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; opacity: .7; font-size: .9rem; }
  .card { border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
          border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: .85rem; margin: 10px 0 4px; }
  select, input[type=number], input[type=text], textarea {
    width: 100%; padding: 8px 10px; border-radius: 8px; font: inherit;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
    background: transparent; color: inherit; }
  textarea { min-height: 56px; resize: vertical; font-family: ui-monospace, monospace; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 130px; }
  .hint { font-size: .78rem; opacity: .65; margin-top: 4px; min-height: 1em; }
  button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 9px;
           border: 0; cursor: pointer; background: #2563eb; color: #fff; }
  button.secondary { background: color-mix(in srgb, currentColor 14%, transparent);
                     color: inherit; }
  button.tertiary { background: transparent; color: inherit; padding: 6px 12px;
                    border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
                    font-weight: 500; font-size: .85rem; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  progress { width: 100%; height: 10px; margin-top: 12px; }
  #status { margin-top: 10px; font-size: .9rem; font-weight: 600; min-height: 1.2em; }
  pre { background: color-mix(in srgb, currentColor 8%, transparent);
        padding: 12px; border-radius: 10px; overflow: auto; font-size: .82rem;
        white-space: pre-wrap; word-break: break-word; }
  .err { color: #dc2626; }
  video { display: none; }

  /* Pixel marker UI */
  .marker-ui { margin: 14px 0 4px; }
  .marker-ui canvas {
    display: block; max-width: 100%; height: auto;
    border-radius: 8px; cursor: crosshair;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
    background: color-mix(in srgb, currentColor 6%, transparent);
  }
  .marker-status { font-size: .85rem; margin-top: 8px; font-weight: 600; }
  .marker-list { font-size: .78rem; opacity: .9; margin-top: 4px;
                 min-height: 1.2em; display: flex; flex-wrap: wrap; gap: 14px; }
  .marker-list .item { display: inline-flex; align-items: center; gap: 4px; }
  .marker-list .swatch { width: 10px; height: 10px; border-radius: 2px;
                         display: inline-block; }
  .marker-list .pending { opacity: .4; }
  .marker-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .marker-frame-row { display: flex; gap: 10px; align-items: center;
                      margin: 8px 0 6px; font-size: .8rem; opacity: .85; }
  .marker-frame-row input[type=range] { flex: 1; }
</style>
</head>
<body>
  <h1>Pose CSV → Test Analizi</h1>
  <p class="sub">Video tarayıcıda işlenir (MediaPipe Pose), pose noktaları CSV'ye
     çıkarılıp Flask'a gönderilir. Video sunucuya yüklenmez.</p>

  <div class="card">
    <label for="test">Test</label>
    <select id="test"></select>
    <div class="hint" id="paramsHint"></div>

    <div class="row">
      <div>
        <label for="height">height_m (boy, metre)</label>
        <input id="height" type="number" step="0.01" placeholder="örn. 1.80" />
      </div>
      <div>
        <label for="model">Model</label>
        <select id="model">
          <option value="lite">lite (hızlı)</option>
          <option value="full" selected>full</option>
          <option value="heavy">heavy (en doğru)</option>
        </select>
      </div>
      <div>
        <label for="conf">Algılama eşiği</label>
        <input id="conf" type="number" step="0.05" min="0" max="1" value="0.3" />
      </div>
      <div>
        <label for="fps">FPS (boş = otomatik)</label>
        <input id="fps" type="number" step="0.01" placeholder="otomatik" />
      </div>
    </div>

    <label for="params">Ek parametreler (satır başına <code>anahtar=değer</code>)</label>
    <textarea id="params" placeholder="örn.&#10;duration=60&#10;joint=knee&#10;painful=false"></textarea>

    <label for="file">Video dosyası</label>
    <input id="file" type="file" accept="video/*" />

    <div id="markerUI" class="marker-ui" hidden>
      <label>Çizgileri işaretle (videonun üstüne tıkla)</label>
      <canvas id="markerCanvas"></canvas>
      <div class="marker-frame-row">
        <span>Önizleme:</span>
        <input id="markerSeek" type="range" min="0" max="1" step="0.001" value="0" />
        <span id="markerTime">0.0s</span>
      </div>
      <div class="marker-status" id="markerStatus"></div>
      <div class="marker-list" id="markerList"></div>
      <div class="marker-actions">
        <button id="markerClear" class="tertiary" type="button">Sıfırla</button>
        <button id="markerUndo"  class="tertiary" type="button">Geri al</button>
      </div>
    </div>

    <div class="actions">
      <button id="run">CSV çıkar &amp; gönder</button>
      <button id="download" class="secondary" disabled>CSV indir</button>
    </div>
    <progress id="bar" value="0" max="1" hidden></progress>
    <div id="status"></div>
  </div>

  <div class="card">
    <label>Sonuç</label>
    <pre id="result">—</pre>
  </div>

  <video id="vid" muted playsinline></video>

<script type="module">
const $ = (id) => document.getElementById(id);
const testSel = $("test"), heightEl = $("height"), modelEl = $("model"),
      confEl = $("conf"), fpsEl = $("fps"), paramsEl = $("params"),
      fileEl = $("file"), runBtn = $("run"), dlBtn = $("download"),
      barEl = $("bar"), statusEl = $("status"), resultEl = $("result"),
      hintEl = $("paramsHint"), vid = $("vid");
// Pixel-marker UI elements
const markerUI = $("markerUI"), markerCanvas = $("markerCanvas"),
      markerStatus = $("markerStatus"), markerList = $("markerList"),
      markerClear = $("markerClear"), markerUndo = $("markerUndo"),
      markerSeek = $("markerSeek"), markerTime = $("markerTime");

const MPV = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.33";
const MODEL_URLS = {
  lite:  "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
  full:  "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
  heavy: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task",
};
// Fugl-Meyer onkol/bilek/FM-D skorlari icin 21-noktali el landmark'i.
const HAND_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const N_PTS = 33;
const N_HAND = 21;
const PARAMS = {};          // test_id -> params[]

// ── YOLO (sprint / çeviklik) ───────────────────────────────────────────────
// Bu testler yalnızca gövdenin yatay konumunu (hip_x) kullanır → tam iskelet
// gerekmez. Tarayıcı-içi YOLOv8n person-detection ile (ONNX Runtime Web, Web
// Worker'da) çalışır; kutudan SENTETİK 33-landmark üretilip mevcut CSV şemasına
// yazılır (backend HİÇ değişmez). Diğer testler MediaPipe pose yolunda kalır.
const YOLO_TESTS = new Set(["30m", "10-20-30m", "5-15", "5-10-5", "5-0-5", "ada", "10mwt"]);
function isYolo() { return YOLO_TESTS.has(testSel.value); }
// yolov8n ONNX modeli STATİK ASSET. Backend statik servis vermediği (/app
// yalnızca index.html döndürür) için HARİCİ bir URL'den yüklenir — kendi
// host'unuza (Vercel Blob / Supabase Storage / herhangi CORS'lu CDN) yükleyip
// aşağıdaki URL'i güncelleyin.
//   Export:  yolo export model=yolov8n.pt format=onnx imgsz=416 simplify=True
//   (int8 için ek nicemleme tercih; çıktı [1,84,A], girdi 1x3x416x416)
const YOLO_MODEL_URL = "https://tkkgmylxdwhoerzkxnyc.supabase.co/storage/v1/object/public/models/yolov8n-416.onnx";
const YOLO_IMGSZ = 416;
// ONNX Runtime Web (WebGPU bundle: webgpu yoksa wasm'a düşer).
const ORT_CDN = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";

// El landmark'i hangi testlerde CSV'ye eklensin (fugl-* = Fugl-Meyer).
function needsHands() { return testSel.value.startsWith("fugl"); }

// Test başına pixel-marker isimleri (sıra: kullanıcı bu sırayla tıklar).
// Buradaki isim = backend'in beklediği form parametresi.
const MARKERS = {
  "10mwt":      ["start_x", "finish_x"],
  "30m":        ["start_x", "finish_x"],
  "10-20-30m":  ["start_x", "split_x_10", "split_x_20", "finish_x"],
  "5-15":       ["start_x", "split_x_5", "finish_x"],
  "5-10-5":     ["left_x", "center_x", "right_x"],
  // 5-0-5: line_x = zamanlama (start/finish) cizgisi, turn_x = 5 m otedeki
  // donus cizgisi. Sporcu ucan baslangicla line_x'ten girer.
  "5-0-5":      ["line_x", "turn_x"],
  // ADA: start_x = baslangic, finish_x = bitis cizgisi (ayni zamanda kalibrasyon).
  // Arasi varsayilan 20 m; farkliysa `cal_distance_m=<m>` ile gir (Ek parametreler).
  // Frenleme mesafesi finish_x gecisinden sonra hesaplanir.
  "ada":        ["start_x", "finish_x"],
};
// Marker görsel renkleri (sırayla).
const MARKER_COLORS = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#a855f7"];

let lastCsv = null;
let _vision = null;         // FilesetResolver (cache'lenir)
let markerValues = {};      // {name: pixel_x_in_video_coords}
let markerCtx = null;
let videoReadyForMarker = false;

function setStatus(t, isErr = false) {
  statusEl.textContent = t;
  statusEl.className = isErr ? "err" : "";
}

// ── Test listesini /'dan al ───────────────────────────────────────────────
async function loadTests() {
  const j = await (await fetch("/")).json();
  const cats = j.categories || {};
  for (const cat of Object.keys(cats)) {
    const og = document.createElement("optgroup");
    og.label = cat;
    let any = false;
    for (const t of cats[cat]) {
      if (t.input === "image_folder") continue;   // sebt: CSV modunda desteklenmez
      PARAMS[t.id] = t.params || [];
      const o = document.createElement("option");
      o.value = t.id; o.textContent = t.id;
      og.appendChild(o); any = true;
    }
    if (any) testSel.appendChild(og);
  }
  testSel.onchange = onTestChange;
  onTestChange();
}
function onTestChange() {
  const p = PARAMS[testSel.value] || [];
  hintEl.textContent = p.length ? "Parametreler: " + p.join(", ") : "";
  // Marker UI'ı bu test gerektiriyorsa göster.
  markerValues = {};
  if (MARKERS[testSel.value]) {
    markerUI.hidden = false;
    if (videoReadyForMarker) redrawMarkerCanvas();
    updateMarkerStatus();
  } else {
    markerUI.hidden = true;
  }
}

// ── Pixel-marker UI ──────────────────────────────────────────────────────
function currentMarkers() { return MARKERS[testSel.value] || []; }
function nextMarker() {
  const names = currentMarkers();
  return names.find((n) => !(n in markerValues)) || null;
}
function updateMarkerStatus() {
  const names = currentMarkers();
  const done = names.filter((n) => n in markerValues).length;
  const nxt = nextMarker();
  markerStatus.textContent = nxt
    ? `Sıradaki: ${nxt}  (${done + 1}/${names.length})`
    : `Tüm çizgiler işaretlendi ✓ (${names.length}/${names.length})`;
  // Liste
  markerList.innerHTML = "";
  names.forEach((n, i) => {
    const sp = document.createElement("span");
    sp.className = "item" + ((n in markerValues) ? "" : " pending");
    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = MARKER_COLORS[i % MARKER_COLORS.length];
    sp.appendChild(sw);
    const tx = document.createElement("span");
    tx.textContent = (n in markerValues)
      ? `${n}=${markerValues[n]}`
      : `${n}=?`;
    sp.appendChild(tx);
    markerList.appendChild(sp);
  });
}

function fitCanvasToVideo() {
  // Canvas çözünürlüğü = video gerçek piksel çözünürlüğü.
  // Görüntü boyutu CSS ile max-width:100% kısıtlanır.
  markerCanvas.width = vid.videoWidth || 1280;
  markerCanvas.height = vid.videoHeight || 720;
  markerCtx = markerCanvas.getContext("2d");
}

function drawMarkerLines() {
  if (!markerCtx) return;
  const names = currentMarkers();
  names.forEach((n, i) => {
    if (!(n in markerValues)) return;
    const x = markerValues[n];
    const c = MARKER_COLORS[i % MARKER_COLORS.length];
    markerCtx.strokeStyle = c;
    markerCtx.lineWidth = Math.max(2, markerCanvas.width / 500);
    markerCtx.beginPath();
    markerCtx.moveTo(x, 0);
    markerCtx.lineTo(x, markerCanvas.height);
    markerCtx.stroke();
    // Etiket
    markerCtx.fillStyle = c;
    markerCtx.font = `${Math.max(14, markerCanvas.width / 60)}px system-ui, sans-serif`;
    markerCtx.textBaseline = "top";
    const pad = 4;
    const txt = n;
    const m = markerCtx.measureText(txt);
    markerCtx.fillRect(x + 4, 4, m.width + pad * 2, parseInt(markerCtx.font) + pad * 2);
    markerCtx.fillStyle = "#fff";
    markerCtx.fillText(txt, x + 4 + pad, 4 + pad);
  });
}

function redrawMarkerCanvas() {
  if (!markerCtx || !videoReadyForMarker) return;
  // Mevcut video frame'ini çiz, sonra çizgileri üstüne bindir.
  markerCtx.drawImage(vid, 0, 0, markerCanvas.width, markerCanvas.height);
  drawMarkerLines();
}

// YOLO çıkarımı sırasında canlı önizleme: o anki video karesi + tespit edilen
// bbox + (varsa) kapı çizgileri. POSE NOKTASI çizilmez; analiz YOLO kutusuyla.
// box koordinatları video native pikselindedir; markerCanvas da native çözünürlükte
// (fitCanvasToVideo) → birebir hizalanır.
function drawYoloPreview(box) {
  if (!markerCtx) return;
  markerCtx.drawImage(vid, 0, 0, markerCanvas.width, markerCanvas.height);
  drawMarkerLines();
  if (!box) return;
  const w = box.x2 - box.x1, h = box.y2 - box.y1;
  markerCtx.lineWidth = Math.max(2, markerCanvas.width / 320);
  markerCtx.strokeStyle = "#22c55e";
  markerCtx.strokeRect(box.x1, box.y1, w, h);
  // hip_x (kutu merkezi) — analizin kullandığı yatay konum.
  const cx = (box.x1 + box.x2) / 2;
  markerCtx.setLineDash([6, 6]);
  markerCtx.beginPath();
  markerCtx.moveTo(cx, box.y1);
  markerCtx.lineTo(cx, box.y2);
  markerCtx.stroke();
  markerCtx.setLineDash([]);
}

async function seek(v, t) {
  return new Promise((res) => {
    const h = () => { v.removeEventListener("seeked", h); res(); };
    v.addEventListener("seeked", h);
    v.currentTime = t;
  });
}

async function initMarkerForVideo() {
  // Video metadata yüklendikten sonra çağrılır.
  fitCanvasToVideo();
  // Ortadaki frame'i göster (sporcu genelde sahnede olur). Slider 0..1 oranı.
  const dur = vid.duration || 0;
  if (dur > 0) {
    await seek(vid, dur * 0.5);
    markerSeek.value = "0.5";
    markerTime.textContent = (dur * 0.5).toFixed(2) + "s";
  } else {
    markerSeek.value = "0";
    markerTime.textContent = "0.0s";
  }
  videoReadyForMarker = true;
  if (!markerUI.hidden) redrawMarkerCanvas();
}

markerCanvas.addEventListener("click", (e) => {
  const nxt = nextMarker();
  if (!nxt) return;
  const rect = markerCanvas.getBoundingClientRect();
  // CSS → video pixel ölçekleme
  const x = Math.round((e.clientX - rect.left) * markerCanvas.width / rect.width);
  markerValues[nxt] = Math.max(0, Math.min(markerCanvas.width - 1, x));
  updateMarkerStatus();
  redrawMarkerCanvas();
});

markerClear.addEventListener("click", () => {
  markerValues = {};
  updateMarkerStatus();
  redrawMarkerCanvas();
});

markerUndo.addEventListener("click", () => {
  const names = currentMarkers();
  // Son işaretleneni bul ve sil.
  for (let i = names.length - 1; i >= 0; i--) {
    if (names[i] in markerValues) {
      delete markerValues[names[i]];
      break;
    }
  }
  updateMarkerStatus();
  redrawMarkerCanvas();
});

markerSeek.addEventListener("input", async () => {
  if (!videoReadyForMarker) return;
  const dur = vid.duration || 0;
  const t = Math.max(0, Math.min(dur - 1e-3, parseFloat(markerSeek.value) * dur));
  await seek(vid, t);
  markerTime.textContent = t.toFixed(2) + "s";
  redrawMarkerCanvas();
});

// ── Video + FPS ───────────────────────────────────────────────────────────
async function loadVideo(file) {
  videoReadyForMarker = false;
  vid.src = URL.createObjectURL(file);
  await new Promise((res, rej) => {
    vid.onloadedmetadata = res;
    vid.onerror = () => rej(new Error("Video yüklenemedi"));
  });
  await initMarkerForVideo();
  return vid;
}
function measureFps(v) {
  if (!("requestVideoFrameCallback" in HTMLVideoElement.prototype))
    return Promise.resolve(null);
  return new Promise((resolve) => {
    const ts = []; let n = 0;
    const done = () => {
      v.pause();
      if (ts.length < 3) return resolve(null);
      const d = [];
      for (let i = 1; i < ts.length; i++) d.push(ts[i] - ts[i - 1]);
      d.sort((a, b) => a - b);
      const med = d[Math.floor(d.length / 2)];
      resolve(med > 0 ? 1 / med : null);
    };
    const cb = (_now, meta) => {
      ts.push(meta.mediaTime); n++;
      if (n < 16 && !v.ended) v.requestVideoFrameCallback(cb);
      else done();
    };
    v.currentTime = 0;
    v.play().then(() => v.requestVideoFrameCallback(cb)).catch(() => resolve(null));
  });
}

// Video seçilince marker UI için ilk frame çiz.
fileEl.addEventListener("change", async () => {
  const file = fileEl.files[0];
  if (!file) return;
  try {
    await loadVideo(file);
  } catch (e) {
    setStatus(e.message || String(e), true);
  }
});

// ── MediaPipe ─────────────────────────────────────────────────────────────
async function makeLandmarker() {
  const { PoseLandmarker, FilesetResolver } = await import(MPV);
  if (!_vision) _vision = await FilesetResolver.forVisionTasks(MPV + "/wasm");
  const conf = parseFloat(confEl.value) || 0.3;
  const opts = {
    baseOptions: { modelAssetPath: MODEL_URLS[modelEl.value], delegate: "GPU" },
    runningMode: "VIDEO", numPoses: 1,
    minPoseDetectionConfidence: conf,
    minPosePresenceConfidence: conf,
    minTrackingConfidence: conf,
  };
  try {
    return await PoseLandmarker.createFromOptions(_vision, opts);
  } catch (e) {
    opts.baseOptions.delegate = "CPU";
    return await PoseLandmarker.createFromOptions(_vision, opts);
  }
}

async function makeHandLandmarker() {
  const { HandLandmarker, FilesetResolver } = await import(MPV);
  if (!_vision) _vision = await FilesetResolver.forVisionTasks(MPV + "/wasm");
  const conf = parseFloat(confEl.value) || 0.3;
  const opts = {
    baseOptions: { modelAssetPath: HAND_MODEL_URL, delegate: "GPU" },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: conf,
    minHandPresenceConfidence: conf,
    minTrackingConfidence: conf,
  };
  try {
    return await HandLandmarker.createFromOptions(_vision, opts);
  } catch (e) {
    opts.baseOptions.delegate = "CPU";
    return await HandLandmarker.createFromOptions(_vision, opts);
  }
}

// Tespit edilen elleri govde tarafina (sol/sag) en yakin bilek mesafesine
// gore ata (backend src/pose_common._assign_hands_to_sides ile ayni mantik).
// handedness etiketi ayna gorunumunde guvenilmez; bilek (landmark 0) mesafesi
// kullanilir. Donus: { lh: [21 pt]|null, rh: [21 pt]|null }.
function assignHands(handRes, poseLm) {
  if (!handRes || !handRes.landmarks || !handRes.landmarks.length || !poseLm)
    return { lh: null, rh: null };
  const lw = poseLm[15], rw = poseLm[16];     // LEFT_WRIST, RIGHT_WRIST
  if (!lw || !rw) return { lh: null, rh: null };
  const best = { left: { pts: null, d: 1e9 }, right: { pts: null, d: 1e9 } };
  for (const hand of handRes.landmarks) {
    if (!hand || !hand.length) continue;
    const h0 = hand[0];
    const dl = (h0.x - lw.x) ** 2 + (h0.y - lw.y) ** 2;
    const dr = (h0.x - rw.x) ** 2 + (h0.y - rw.y) ** 2;
    const side = dl <= dr ? "left" : "right";
    const d = Math.min(dl, dr);
    if (d < best[side].d) best[side] = { pts: hand, d };
  }
  return { lh: best.left.pts, rh: best.right.pts };
}

// ── CSV ───────────────────────────────────────────────────────────────────
function header(withHands) {
  const c = ["frame", "time_s", "width", "height", "fps"];
  for (let i = 0; i < N_PTS; i++) c.push(`x${i}`, `y${i}`, `z${i}`, `v${i}`);
  for (let i = 0; i < N_PTS; i++) c.push(`wx${i}`, `wy${i}`, `wz${i}`);
  if (withHands) {
    for (let i = 0; i < N_HAND; i++) c.push(`lhx${i}`, `lhy${i}`, `lhv${i}`);
    for (let i = 0; i < N_HAND; i++) c.push(`rhx${i}`, `rhy${i}`, `rhv${i}`);
  }
  return c.join(",");
}
function _handCells(hand) {
  // 21 noktayi x,y,v (visibility=1) olarak yaz; el yoksa hucreler bos.
  if (!hand) return Array(N_HAND * 3).fill("");
  const out = [];
  for (let i = 0; i < N_HAND; i++) {
    const p = hand[i];
    if (p) out.push(p.x.toFixed(8), p.y.toFixed(8), "1.000000");
    else out.push("", "", "");
  }
  return out;
}
function row(frame, t, W, H, fps, res, hands, withHands) {
  const meta = [frame, t.toFixed(5), W, H, fps.toFixed(5)];
  const lm = res.landmarks && res.landmarks[0];
  if (!lm) {
    let n = N_PTS * 4 + N_PTS * 3;
    if (withHands) n += N_HAND * 3 * 2;        // pose yok -> el de yazilmaz
    return meta.concat(Array(n).fill("")).join(",");
  }
  const wm = res.worldLandmarks && res.worldLandmarks[0];
  const out = meta.slice();
  for (let i = 0; i < N_PTS; i++) {
    const p = lm[i];
    out.push(p.x.toFixed(8), p.y.toFixed(8), (p.z ?? 0).toFixed(8),
             (p.visibility ?? 1).toFixed(6));
  }
  for (let i = 0; i < N_PTS; i++) {
    const p = wm ? wm[i] : null;
    if (p) out.push(p.x.toFixed(8), p.y.toFixed(8), p.z.toFixed(8));
    else out.push("0", "0", "0");
  }
  if (withHands) {
    out.push(..._handCells(hands ? hands.lh : null));
    out.push(..._handCells(hands ? hands.rh : null));
  }
  return out.join(",");
}

// ── YOLO yolu (sprint/çeviklik) ─────────────────────────────────────────────
// Tüm ağır iş (preprocess → ONNX inference → NMS → takip) Worker'da; ana thread
// sadece kareyi seek edip ImageBitmap'i transfer eder ve progress günceller →
// mobilde UI donmaz. Aynı anda yalnızca tek kare işlenir (bellek birikmez).
function yoloWorkerSource() {
  return `
  let session = null, ort = null, IMGSZ = 416, prev = null, canvas = null, ctx = null;
  function ensureCanvas(){ if(!canvas){ canvas = new OffscreenCanvas(IMGSZ,IMGSZ); ctx = canvas.getContext("2d",{willReadFrequently:true}); } }
  function iou(a,b){ const x1=Math.max(a.x1,b.x1),y1=Math.max(a.y1,b.y1),x2=Math.min(a.x2,b.x2),y2=Math.min(a.y2,b.y2);
    const w=Math.max(0,x2-x1),h=Math.max(0,y2-y1),inter=w*h; const ua=(a.x2-a.x1)*(a.y2-a.y1)+(b.x2-b.x1)*(b.y2-b.y1)-inter; return ua>0?inter/ua:0; }
  function nms(arr,thr){ arr.sort((p,q)=>q.s-p.s); const keep=[]; for(const c of arr){ let ok=true; for(const k of keep){ if(iou(c,k)>thr){ok=false;break;} } if(ok)keep.push(c);} return keep; }
  async function infer(bitmap, W, H, conf){
    ensureCanvas();
    const scale = Math.min(IMGSZ/W, IMGSZ/H);
    const nw = Math.round(W*scale), nh = Math.round(H*scale);
    const padX = Math.floor((IMGSZ-nw)/2), padY = Math.floor((IMGSZ-nh)/2);
    ctx.clearRect(0,0,IMGSZ,IMGSZ);
    ctx.drawImage(bitmap, 0,0,W,H, padX,padY,nw,nh);
    const img = ctx.getImageData(0,0,IMGSZ,IMGSZ).data;
    const n = IMGSZ*IMGSZ, input = new Float32Array(3*n);
    for(let i=0;i<n;i++){ input[i]=img[i*4]/255; input[n+i]=img[i*4+1]/255; input[2*n+i]=img[i*4+2]/255; }
    const t = new ort.Tensor("float32", input, [1,3,IMGSZ,IMGSZ]);
    const feeds = {}; feeds[session.inputNames[0]] = t;
    const out = await session.run(feeds);
    const o = out[session.outputNames[0]], data = o.data, dims = o.dims; // [1,84,A]
    const A = dims[2];
    const cands = [];
    for(let j=0;j<A;j++){
      const s = data[4*A + j];           // class 0 (person) skoru
      if(s < conf) continue;
      const cx=data[j], cy=data[A+j], bw=data[2*A+j], bh=data[3*A+j];
      const x1=(cx-bw/2-padX)/scale, y1=(cy-bh/2-padY)/scale, x2=(cx+bw/2-padX)/scale, y2=(cy+bh/2-padY)/scale;
      cands.push({x1,y1,x2,y2,s});
    }
    const keep = nms(cands, 0.45);
    if(!keep.length) return null;
    let best = keep[0];
    if(prev){ // süreklilik: önceki merkeze yakın + büyük kutu
      const pcx=(prev.x1+prev.x2)/2, pcy=(prev.y1+prev.y2)/2; let bs=-1;
      for(const b of keep){ const area=Math.max(0,b.x2-b.x1)*Math.max(0,b.y2-b.y1); const d=Math.hypot((b.x1+b.x2)/2-pcx,(b.y1+b.y2)/2-pcy); const sc=area/(1+d); if(sc>bs){bs=sc;best=b;} }
    } else { let ba=-1; for(const b of keep){ const area=Math.max(0,b.x2-b.x1)*Math.max(0,b.y2-b.y1); if(area>ba){ba=area;best=b;} } }
    prev = best;
    return { x1:Math.max(0,Math.min(W,best.x1)), y1:Math.max(0,Math.min(H,best.y1)), x2:Math.max(0,Math.min(W,best.x2)), y2:Math.max(0,Math.min(H,best.y2)) };
  }
  self.onmessage = async (e) => {
    const m = e.data;
    try {
      if(m.type==="init"){
        IMGSZ = m.imgsz;
        importScripts(m.ortCdn + "ort.webgpu.min.js");
        ort = self.ort; ort.env.wasm.wasmPaths = m.ortCdn;
        try { session = await ort.InferenceSession.create(m.modelUrl, { executionProviders:["webgpu","wasm"] }); }
        catch(err){ session = await ort.InferenceSession.create(m.modelUrl, { executionProviders:["wasm"] }); }
        prev = null; self.postMessage({type:"ready"}); return;
      }
      if(m.type==="frame"){ const box = await infer(m.bitmap, m.w, m.h, m.conf); m.bitmap.close(); self.postMessage({type:"box", index:m.index, box}); return; }
    } catch(err){ self.postMessage({type:"error", message:String(err && err.message || err)}); }
  };
  `;
}

function makeYoloWorker() {
  return new Promise((resolve, reject) => {
    const blob = new Blob([yoloWorkerSource()], { type: "text/javascript" });
    const w = new Worker(URL.createObjectURL(blob));
    const onmsg = (e) => {
      if (e.data.type === "ready") { w.removeEventListener("message", onmsg); resolve(w); }
      else if (e.data.type === "error") { w.removeEventListener("message", onmsg); w.terminate(); reject(new Error(e.data.message)); }
    };
    w.addEventListener("message", onmsg);
    w.onerror = (ev) => reject(new Error(ev.message || "YOLO worker hatası"));
    w.postMessage({ type: "init", modelUrl: YOLO_MODEL_URL, imgsz: YOLO_IMGSZ, ortCdn: ORT_CDN });
  });
}

// Kutudan SENTETİK 33-landmark CSV satırı (el yok). box null -> "pose yok".
// hip_x = kutu merkezi (x23=x24=cx); dikey dağılım kutu üst/orta/alt'a göre.
function rowFromBox(frame, t, W, H, fps, box) {
  const meta = [frame, t.toFixed(5), W, H, fps.toFixed(5)];
  if (!box) {
    return meta.concat(Array(N_PTS * 4 + N_PTS * 3).fill("")).join(",");
  }
  const cx = ((box.x1 + box.x2) / 2) / W;
  const top = box.y1 / H, bot = box.y2 / H, h = bot - top, cy = (top + bot) / 2;
  const yOf = (i) =>
    i === 0 ? top
    : (i === 11 || i === 12) ? top + 0.15 * h
    : (i === 23 || i === 24) ? top + 0.55 * h
    : (i === 25 || i === 26) ? top + 0.78 * h
    : (i === 27 || i === 28) ? bot
    : cy;
  const out = meta.slice();
  for (let i = 0; i < N_PTS; i++) out.push(cx.toFixed(8), yOf(i).toFixed(8), "0", "1.000000");
  for (let i = 0; i < N_PTS; i++) out.push("0", "0", "0");   // world landmark'lar
  return out.join(",");
}

async function extractYolo(v, fps) {
  const W = v.videoWidth, H = v.videoHeight, dur = v.duration;
  const N = Math.max(1, Math.floor(dur * fps));
  const conf = parseFloat(confEl.value) || 0.3;
  const worker = await makeYoloWorker();
  const lines = [header(false)];
  barEl.hidden = false; barEl.max = N;
  try {
    for (let i = 0; i < N; i++) {
      const t = Math.min(i / fps, Math.max(0, dur - 1e-3));
      await seek(v, t);
      const bitmap = await createImageBitmap(v);
      const box = await new Promise((resolve, reject) => {
        const onmsg = (e) => {
          if (e.data.type === "box" && e.data.index === i) { worker.removeEventListener("message", onmsg); resolve(e.data.box); }
          else if (e.data.type === "error") { worker.removeEventListener("message", onmsg); reject(new Error(e.data.message)); }
        };
        worker.addEventListener("message", onmsg);
        worker.postMessage({ type: "frame", bitmap, w: W, h: H, index: i, conf }, [bitmap]);
      });
      lines.push(rowFromBox(i, i / fps, W, H, fps, box));
      // Canlı önizleme: o anki kareyi + tespit edilen bbox'ı markerCanvas'a çiz
      // (pose noktası DEĞİL — analiz YOLO kutusuyla yapılıyor). Kapı çizgileri de korunur.
      drawYoloPreview(box);
      if (i % 3 === 0 || i === N - 1) {
        barEl.value = i + 1;
        setStatus(`YOLO işleniyor… ${i + 1}/${N}`);
        await new Promise((r) => requestAnimationFrame(r));   // UI nefes alsın
      }
    }
  } finally {
    worker.terminate();
  }
  return lines.join("\n");
}

async function extract(v, lmk, hlmk, fps) {
  const W = v.videoWidth, H = v.videoHeight, dur = v.duration;
  const N = Math.max(1, Math.floor(dur * fps));
  const withHands = !!hlmk;
  const lines = [header(withHands)];
  barEl.hidden = false; barEl.max = N;
  for (let i = 0; i < N; i++) {
    const t = Math.min(i / fps, Math.max(0, dur - 1e-3));
    await seek(v, t);
    const ts = Math.round((i * 1000) / fps);
    const res = lmk.detectForVideo(v, ts);
    let hands = null;
    if (hlmk) {
      const hres = hlmk.detectForVideo(v, ts);
      hands = assignHands(hres, res.landmarks && res.landmarks[0]);
    }
    lines.push(row(i, i / fps, W, H, fps, res, hands, withHands));
    if (i % 4 === 0 || i === N - 1) {
      barEl.value = i + 1;
      setStatus(`Pose çıkarılıyor… ${i + 1}/${N}`);
      await new Promise((r) => requestAnimationFrame(r));   // UI nefes alsın
    }
  }
  return lines.join("\n");
}

// ── Gönderim ──────────────────────────────────────────────────────────────
async function send(testId, csv) {
  const fd = new FormData();
  // Uzun videolarda CSV 40+ MB olur (Cloud Run HTTP/1 limiti 32 MiB);
  // gzip ~3x kucultur. Backend gzip'i icerikten (1f 8b) tanir.
  let blob = new Blob([csv], { type: "text/csv" });
  if (typeof CompressionStream !== "undefined") {
    blob = await new Response(
      blob.stream().pipeThrough(new CompressionStream("gzip"))).blob();
  }
  fd.append("csv", blob, "pose.csv");
  const h = heightEl.value.trim();
  if (h) fd.append("height_m", h);
  // Pixel marker'lar (varsa)
  for (const [k, v] of Object.entries(markerValues)) {
    fd.append(k, String(v));
  }
  // Ek parametreler (markerlardan sonra; gerekirse override eder)
  for (const line of paramsEl.value.split("\n")) {
    const s = line.trim();
    const i = s.indexOf("=");
    if (i > 0) fd.append(s.slice(0, i).trim(), s.slice(i + 1).trim());
  }
  const resp = await fetch(`/analyze/${testId}`, { method: "POST", body: fd });
  let json;
  try { json = await resp.json(); } catch { json = { error: await resp.text() }; }
  resultEl.textContent = JSON.stringify(json, null, 2);
  resultEl.classList.toggle("err", !resp.ok);
  setStatus(resp.ok ? "Tamam ✓" : `Hata (${resp.status})`, !resp.ok);
}

// ── Akış ──────────────────────────────────────────────────────────────────
async function run() {
  const file = fileEl.files[0];
  if (!file) { setStatus("Önce bir video seçin.", true); return; }
  // Pixel marker'lar zorunluysa eksik olmasın.
  const reqMarkers = MARKERS[testSel.value];
  if (reqMarkers) {
    const missing = reqMarkers.filter((n) => !(n in markerValues));
    if (missing.length) {
      setStatus(`Eksik çizgi: ${missing.join(", ")} — videoda tıkla.`, true);
      return;
    }
  }
  runBtn.disabled = true; dlBtn.disabled = true;
  let lmk = null, hlmk = null;
  try {
    // Video + FPS (her iki yol için ortak).
    setStatus("Video yükleniyor…");
    // Video zaten fileEl.onchange ile yüklü; metadata garantilemek için tekrar bekle.
    if (!vid.duration) await loadVideo(file);
    let fps = parseFloat(fpsEl.value);
    if (!fps || fps <= 0) { setStatus("FPS ölçülüyor…"); fps = (await measureFps(vid)) || 30; }
    fpsEl.value = fps.toFixed(2);

    if (isYolo()) {
      // Sprint/çeviklik: tarayıcı-içi YOLO (Worker). MediaPipe yüklenmez.
      setStatus("YOLO modeli yükleniyor…");
      lastCsv = await extractYolo(vid, fps);
    } else {
      // Pose-bağımlı testler: MediaPipe yolu (değişmedi).
      setStatus("Model yükleniyor…");
      lmk = await makeLandmarker();
      if (needsHands()) { setStatus("El modeli yükleniyor…"); hlmk = await makeHandLandmarker(); }
      lastCsv = await extract(vid, lmk, hlmk, fps);
    }
    dlBtn.disabled = false;
    setStatus("CSV gönderiliyor…");
    await send(testSel.value, lastCsv);
  } catch (e) {
    setStatus(e.message || String(e), true);
    resultEl.textContent = String(e.stack || e);
    resultEl.classList.add("err");
  } finally {
    if (lmk && lmk.close) lmk.close();
    if (hlmk && hlmk.close) hlmk.close();
    barEl.hidden = true; runBtn.disabled = false;
    // Marker preview'ı tekrar göster (extract pose seek'leriyle değişmişti).
    if (!markerUI.hidden && videoReadyForMarker) redrawMarkerCanvas();
  }
}

dlBtn.onclick = () => {
  if (!lastCsv) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lastCsv], { type: "text/csv" }));
  a.download = `${testSel.value}_pose.csv`;
  a.click();
};
runBtn.onclick = run;
loadTests().catch((e) => setStatus("Test listesi alınamadı: " + e.message, true));
</script>
